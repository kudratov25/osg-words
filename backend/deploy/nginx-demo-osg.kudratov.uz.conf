# /etc/nginx/sites-available/demo-osg.kudratov.uz  (symlinked into sites-enabled)
# Read-only dashboard demo: static files only (admin-panel `npm run build:demo`
# -> dist-demo/), no backend. HTTPS lines are added by:
#   certbot --nginx -d demo-osg.kudratov.uz
server {
    server_name demo-osg.kudratov.uz;
    root /srv/osg-demo;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    gzip on;
    gzip_types application/json application/javascript text/css;
    gzip_min_length 1024;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
