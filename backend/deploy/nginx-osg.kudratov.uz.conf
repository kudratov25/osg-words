# /etc/nginx/sites-available/osg.kudratov.uz  (symlinked into sites-enabled)
# HTTPS lines are added by: certbot --nginx -d osg.kudratov.uz
server {
    server_name osg.kudratov.uz;
    client_max_body_size 1M;

    # Landing page (static): /srv/osg-site
    location = / {
        root /srv/osg-site;
        try_files /index.html =404;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
    location = /privacy { root /srv/osg-site; try_files /privacy.html =404; }
    location = /robots.txt { root /srv/osg-site; }
    location ^~ /site/ {
        root /srv/osg-site;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Admin panel (Vue SPA): static files in /srv/osg-admin/panel/
    location = /panel { return 301 /panel/; }
    location ^~ /panel/ {
        root /srv/osg-admin;
        try_files $uri $uri/ /panel/index.html;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        location ~* ^/panel/assets/ {
            root /srv/osg-admin;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        # JSON word packs are ~350 KB; gzip makes them several times smaller.
        gzip on;
        gzip_types application/json;
        gzip_proxied any;
        gzip_min_length 1024;
        gzip_vary on;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/osg.kudratov.uz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/osg.kudratov.uz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = osg.kudratov.uz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name osg.kudratov.uz;
    return 404; # managed by Certbot


}