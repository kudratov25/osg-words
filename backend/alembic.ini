# Alembic config. The app runs `upgrade head` itself on startup
# (app/migrate.py), so this file is only needed for manual commands, e.g.
#   cd backend && .venv/bin/alembic current
#   cd backend && .venv/bin/alembic revision -m "add x"   (then edit the file)
# The database URL comes from DATABASE_URL (app/config.py), not from here.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
